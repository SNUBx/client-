<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site Safe Alliance — Independent CITB Test &amp; CSCS Card Support</title>
    <meta name="description" content="Site Safe Alliance Ltd is an independent administrative support company helping individuals and employers across the UK arrange CITB tests, CSCS card applications and accredited construction training." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // For GitHub Pages repository subpaths (e.g., username.github.io/my-repo without trailing slash),
      // ensure trailing slash so relative asset resolution './assets/...' works reliably.
      (function() {
        var host = window.location.hostname;
        var p = window.location.pathname;
        if (host.endsWith('github.io') && p.split('/').filter(Boolean).length === 1 && !p.endsWith('/')) {
          window.location.replace(window.location.origin + p + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body class="bg-[#fdfdfd] text-slate-800 antialiased font-sans selection:bg-slate-900 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
