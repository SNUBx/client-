<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site Safe Alliance — Independent CITB Test &amp; CSCS Card Support</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Stores path and redirects to base URL so the SPA router handles it
      sessionStorage.redirect = location.href;
      var pathSegments = location.pathname.split('/').filter(Boolean);
      // If deployed at repository root or subpath, redirect to repo root
      var repo = pathSegments.length > 0 ? '/' + pathSegments[0] + '/' : '/';
      location.replace(repo);
    </script>
  </head>
  <body>
    <p>Redirecting to Site Safe Alliance...</p>
  </body>
</html>
