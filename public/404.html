<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site Safe Alliance — Loading</title>
    <script>
      // Safe SPA redirect for GitHub Pages: redirect back to base repository or root URL
      (function() {
        var path = window.location.pathname;
        var segments = path.split('/').filter(Boolean);
        // If GitHub Pages project site (e.g. /repo-name/page), base is /repo-name/
        // Otherwise on custom domain or root, base is /
        var isGitHubPagesSubfolder = window.location.hostname.endsWith('github.io') && segments.length > 0;
        var targetBase = isGitHubPagesSubfolder ? ('/' + segments[0] + '/') : '/';
        if (path !== targetBase) {
          window.location.replace(targetBase);
        }
      })();
    </script>
  </head>
  <body style="font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8fafc; color: #334155;">
    <div style="text-align: center;">
      <p style="font-weight: 600; font-size: 16px;">Loading Site Safe Alliance...</p>
      <a href="./" style="color: #263B52; text-decoration: underline; font-size: 14px;">Click here if not redirected</a>
    </div>
  </body>
</html>
